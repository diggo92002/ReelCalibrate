<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#205c50">
  <meta name="description" content="捲線器米數誤差換算工具，支援手機數字鍵盤與自訂倍數。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="米數換算">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>捲線器誤差換算</title>
  <style>
    :root{color-scheme:light;--ink:#183b38;--muted:#687b75;--line:#dce5df;--accent:#205c50}
    *{box-sizing:border-box}body{margin:0;background:#eef3ed;color:var(--ink);font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;min-height:100dvh}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #d4a443;outline-offset:3px}
    main{max-width:680px;margin:auto;padding:calc(32px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}header{padding:0 5px;margin-bottom:28px}h1{font-size:clamp(25px,6vw,34px);margin:0 0 12px;letter-spacing:.03em}header p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
    .card{background:#fffefa;border:1px solid var(--line);border-radius:20px;padding:22px 14px;margin-bottom:18px}.heading{display:flex;align-items:center;gap:10px;margin-bottom:22px}.step{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:12px;color:var(--muted)}h2{font-size:16px;margin:0}.fields{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,.8fr);gap:8px}.field{min-width:0}.label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.number{display:flex;align-items:center;justify-content:center;min-height:68px;width:100%;padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-size:clamp(18px,5vw,27px);font-weight:650;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.number:active{background:#eff5ef}.result{background:#e5f0e8;color:#195746;border-color:#d6e6dc}.unit{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:8px}.formula{font-size:12px;color:var(--muted);margin:18px 0 0;padding-top:14px;border-top:1px solid #edf0eb;overflow-wrap:anywhere}footer{font-size:12px;color:var(--muted);text-align:center;line-height:1.8;margin-top:24px}.reset{border:0;background:transparent;color:var(--accent);padding:14px;text-decoration:underline;text-underline-offset:4px}#storage-note{color:#925c22}
    dialog{width:min(360px,calc(100% - 28px));max-height:calc(100dvh - 24px);overflow:auto;border:0;border-radius:22px;padding:20px;background:#fffefa;color:var(--ink);box-shadow:0 25px 80px #0003}dialog::backdrop{background:#102d2866}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.close{border:0;border-radius:50%;width:42px;height:42px;font-size:24px;background:#edf2ed;color:var(--ink)}#entry{width:100%;height:62px;padding:12px;border:1px solid var(--line);border-radius:12px;text-align:right;font-size:30px;background:white;color:var(--ink)}.error{color:#ad382e;min-height:20px;font-size:12px;margin:8px 0}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{min-height:52px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-size:22px}.keypad button:active{background:#dfeae2}.keypad .utility{font-size:14px;background:#eef2ec}.keypad .confirm{grid-column:2 / 4;background:var(--accent);color:white;font-size:16px;font-weight:700}
    @media(min-width:600px){main{padding-top:55px}.card{padding:26px}.fields{gap:18px}.label{font-size:14px}.number{min-height:80px;font-size:30px}}@media(max-height:650px){dialog{padding:16px}.dialog-head{margin-bottom:8px}.keypad button{min-height:42px}.keypad{gap:6px}#entry{height:50px}}
  </style>
</head>
<body>
  <main>
    <header><h1>捲線器誤差換算</h1><p>點選米數或倍數，開啟數字鍵盤。<br>左欄米數 × 右欄倍數 = 中欄結果</p></header>
    <section class="card" aria-labelledby="title-0">
      <div class="heading"><span class="step">01</span><h2 id="title-0">現有米數 → 實際米數</h2></div>
      <div class="fields">
        <div class="field"><span class="label">現有米數</span><button class="number editable" data-row="0" data-kind="value" aria-label="輸入現有米數">0</button><span class="unit">米 · 點選輸入</span></div>
        <div class="field"><span class="label">實際米數</span><output class="number result" id="result-0" aria-live="polite">0</output><span class="unit">米 · 換算結果</span></div>
        <div class="field"><span class="label">換算倍數</span><button class="number editable" data-row="0" data-kind="factor" aria-label="修改第一組倍數">0.66</button><span class="unit">點選修改</span></div>
      </div><p class="formula" id="formula-0">0 × 0.66 = 0 米</p>
    </section>
    <section class="card" aria-labelledby="title-1">
      <div class="heading"><span class="step">02</span><h2 id="title-1">實際米數 → 要放米數</h2></div>
      <div class="fields">
        <div class="field"><span class="label">實際米數</span><button class="number editable" data-row="1" data-kind="value" aria-label="輸入實際米數">0</button><span class="unit">米 · 點選輸入</span></div>
        <div class="field"><span class="label">要放米數</span><output class="number result" id="result-1" aria-live="polite">0</output><span class="unit">米 · 換算結果</span></div>
        <div class="field"><span class="label">換算倍數</span><button class="number editable" data-row="1" data-kind="factor" aria-label="修改第二組倍數">1.5</button><span class="unit">點選修改</span></div>
      </div><p class="formula" id="formula-1">0 × 1.5 = 0 米</p>
    </section>
    <footer>倍數會保存在這台裝置的瀏覽器中。<div id="storage-note" role="status"></div><button class="reset" id="reset">清空米數</button></footer>
  </main>
  <dialog id="number-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title">輸入米數</h2><button class="close" id="cancel" aria-label="取消輸入">×</button></div>
    <input id="entry" type="text" inputmode="none" readonly aria-label="數字" maxlength="24">
    <p class="error" id="error" role="alert"></p>
    <div class="keypad">
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="clear" class="utility">清除</button><button data-key="0">0</button><button data-key=".">.</button>
      <button data-key="back" class="utility" aria-label="退一格">⌫</button><button data-key="confirm" class="confirm">確定</button>
    </div>
  </dialog>
  <script>
    'use strict';
    function normalize(value) {
      const [whole, fraction = ''] = value.split('.');
      const integer = whole.replace(/^0+(?=\d)/, '') || '0';
      const decimal = fraction.replace(/0+$/, '');
      return integer + (decimal ? '.' + decimal : '');
    }
    function multiply(left, right) {
      const places = value => (value.split('.')[1] || '').length;
      const scale = places(left) + places(right);
      const product = (BigInt(left.replace('.', '')) * BigInt(right.replace('.', ''))).toString();
      if (!scale) return product;
      const padded = product.padStart(scale + 1, '0');
      return normalize(padded.slice(0, -scale) + '.' + padded.slice(-scale));
    }
    function isValid(value) { return typeof value === 'string' && value.length <= 24 && /^\d+(\.\d*)?$/.test(value); }
    const storageKey = 'reel-converter-factors-v1';
    const rows = [{value:'0', factor:'0.66'}, {value:'0', factor:'1.5'}];
    const storageNote = document.getElementById('storage-note');
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(saved) && saved.length === 2 && saved.every(isValid)) saved.forEach((factor, i) => rows[i].factor = normalize(factor));
    } catch { storageNote.textContent = '目前無法讀取已儲存的倍數，使用預設值。'; }
    function render() {
      rows.forEach((row, i) => {
        const result = multiply(row.value, row.factor);
        document.querySelector(`[data-row="${i}"][data-kind="value"]`).textContent = row.value;
        document.querySelector(`[data-row="${i}"][data-kind="factor"]`).textContent = row.factor;
        document.getElementById(`result-${i}`).textContent = result;
        document.getElementById(`formula-${i}`).textContent = `${row.value} × ${row.factor} = ${result} 米`;
      });
    }
    const dialog = document.getElementById('number-dialog');
    const entry = document.getElementById('entry');
    const error = document.getElementById('error');
    let active = null;
    let replace = true;
    document.querySelectorAll('.editable').forEach(button => button.addEventListener('click', () => {
      active = {row:Number(button.dataset.row), kind:button.dataset.kind};
      document.getElementById('dialog-title').textContent = button.getAttribute('aria-label');
      entry.value = rows[active.row][active.kind]; replace = true; error.textContent = '';
      dialog.showModal(); entry.focus(); entry.select();
    }));
    function press(key) {
      error.textContent = '';
      if (key === 'confirm') {
        if (!isValid(entry.value)) { error.textContent = '請輸入有效的米數或倍數。'; return; }
        rows[active.row][active.kind] = normalize(entry.value);
        if (active.kind === 'factor') {
          try { localStorage.setItem(storageKey, JSON.stringify(rows.map(row => row.factor))); storageNote.textContent = ''; }
          catch { storageNote.textContent = '倍數已更新，但無法儲存，下次開啟可能使用預設值。'; }
        }
        render(); dialog.close(); return;
      }
      if (key === 'clear') { entry.value = ''; replace = false; return; }
      if (key === 'back') { entry.value = replace ? '' : entry.value.slice(0, -1); replace = false; return; }
      if (!/^[0-9.]$/.test(key)) return;
      let next = replace ? '' : entry.value;
      if (key === '.' && next.includes('.')) return;
      if (key === '.' && !next) next = '0';
      if (next.length >= 24) { error.textContent = '最多可輸入 24 個字元。'; return; }
      entry.value = next + key; replace = false;
    }
    document.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => press(button.dataset.key)));
    document.getElementById('cancel').addEventListener('click', () => dialog.close());
    document.addEventListener('keydown', event => {
      if (!dialog.open || event.ctrlKey || event.metaKey || event.altKey) return;
      const key = /^[0-9.]$/.test(event.key) ? event.key : ({Backspace:'back', Delete:'clear', Enter:'confirm'})[event.key];
      if (key) { event.preventDefault(); press(key); }
    });
    document.getElementById('reset').addEventListener('click', () => { rows.forEach(row => row.value = '0'); render(); });
    render();
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
